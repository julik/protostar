name: CI
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same branch supersedes a run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # test/.timings balances the workers; any earlier run's copy beats none
      - uses: actions/cache@v4
        with:
          path: test/.timings
          key: test-timings-${{ matrix.ruby }}-${{ github.run_id }}
          restore-keys: test-timings-${{ matrix.ruby }}-
      - name: tests, a worker process per core
        run: bundle exec rake test
      - run: bundle exec rake rbs:validate
  warnings:
    # The parallel matrix above is the test gate; this one serial run, on the
    # newest Ruby, which warns the most, keeps lib/ warning-free
    name: no warnings from lib/ under ruby -w (serial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake test:warnings
  oracle:
    name: cross-check against google-protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
        env:
          BUNDLE_WITH: oracle
      - run: bundle exec rake test
      - run: bundle exec rake rbs:validate
      - name: no warnings from lib/ under ruby -w
        run: bundle exec rake test:warnings
        env:
          PROTOSTAR_ORACLE: "1"
  shim:
    name: google-protobuf shim
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest and the mainstream Ruby; the root test job covers 3.3 and 4.0 for the runtime
        ruby: ["3.2", "3.4"]
    defaults:
      run:
        working-directory: shims/google-protobuf
    steps:
      - uses: actions/checkout@v4
        with:
          # the Bundler test locks a git source at this checkout's HEAD
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: shims/google-protobuf
      - run: bundle exec rake generate:check test
      - name: pbbuilder's own suite on the shim
        if: matrix.ruby == '3.4'
        working-directory: .
        run: bundle install && bundle exec rake shim:pbbuilder
      - name: pbbuilder's own suite on Protostar::Builder (llm/outputs/ws9-pbbuilder.patch)
        if: matrix.ruby == '3.4'
        working-directory: .
        run: bundle exec rake builder:pbbuilder
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake standard
      - name: sig/ and rbi/protostar.rbi are what lib/ generates
        run: bundle exec rake types:check
      - name: lib/ typechecks with Steep
        run: bundle exec rake steep
      - name: API docs build with no RDoc warnings
        run: bundle exec rake rdoc
  conformance:
    name: protobuf conformance suite (binary, JSON, text format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - id: flags
        run: echo "digest=$(ruby script/conformance.rb cmake-flags | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - id: runner
        uses: actions/cache@v4
        with:
          path: ~/.cache/protostar/conformance-36.2/bin
          key: conformance-runner-v36.2-${{ runner.os }}-${{ steps.flags.outputs.digest }}
      - if: steps.runner.outputs.cache-hit != 'true'
        run: bundle exec rake conformance:build
      - run: bundle exec rake conformance:check conformance:run
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-failures
          path: tmp/conformance
