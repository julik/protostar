syntax = "proto3";

package pbshim;

import "google/protobuf/field_mask.proto";

// The shape pbbuilder's own tests build: nested, repeated, map and
// well-known fields
message Person {
  string name = 1;
  repeated Person friends = 2;
  Person best_friend = 3;
  repeated string nicknames = 4;
  google.protobuf.FieldMask field_mask = 5;
  map<string, string> favourite_foods = 6;
  repeated string tags = 7;
  bool boolean_me = 9;
  Asset logo = 10;
  map<string, Asset> assets = 11;
}

message Asset {
  string url = 1;
}
