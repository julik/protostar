// People, for the CLI tests.
syntax = "proto3";

package acme;

import "google/protobuf/timestamp.proto";

// A person.
message Person {
  string name = 1;
  int32 id = 2;
  repeated string emails = 3;
  google.protobuf.Timestamp born = 4;
  map<string, Person> friends = 5;
  Kind kind = 6;

  enum Kind {
    UNKNOWN = 0;
    HUMAN = 1;
  }
}
